<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <title>StockNest Logo</title>
  <desc>Minimal financial logo with rising bars and upward arrow, followed by StockNest wordmark.</desc>

  <!-- Icon -->
  <g transform="translate(25 25)">
    <!-- Circular growth arc -->
    <path d="M25 165 A105 105 0 1 1 195 70"
          fill="none" stroke="#2563B8" stroke-width="16"
          stroke-linecap="round"/>

    <!-- Rising bars -->
    <rect x="55" y="105" width="28" height="55" rx="2" fill="#2563B8"/>
    <rect x="92" y="78" width="28" height="82" rx="2" fill="#2563B8"/>
    <rect x="129" y="45" width="28" height="115" rx="2" fill="#2563B8"/>

    <!-- Upward trend arrow -->
    <path d="M20 185 L82 128 L120 158 L190 92"
          fill="none" stroke="#3FA45B" stroke-width="16"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M166 92 H190 V116"
          fill="none" stroke="#3FA45B" stroke-width="16"
          stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Wordmark -->
  <text x="275" y="178"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112"
        font-weight="700"
        letter-spacing="-5">
    <tspan fill="#102A63">Stock</tspan><tspan fill="#3FA45B">Nest</tspan>
  </text>
</svg>
